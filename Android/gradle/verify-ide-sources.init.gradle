// Android Studio resolves source attachments that assemble/test tasks do not request.
// Run from Android/: ./gradlew -I gradle/verify-ide-sources.init.gradle verifyIdeSources
// Discover plugin/Android/JVM sources, Javadocs and AndroidX source-variant files.
// This task never generates or bypasses checksums.
def settingsBuildscript
gradle.settingsEvaluated { settings ->
    settingsBuildscript = settings.buildscript
    // Android Studio requests this ZIP separately from Maven source attachments.
    settings.dependencyResolutionManagement.repositories.exclusiveContent {
        forRepository {
            settings.dependencyResolutionManagement.repositories.ivy {
                name = 'Gradle distributions'
                url = 'https://services.gradle.org/distributions'
                patternLayout { artifact('[artifact]-[revision]-[classifier].[ext]') }
                metadataSources { artifact() }
            }
        }
        filter { includeModule('gradle', 'gradle') }
    }
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('verifyIdeSources') {
        group = 'verification'
        description = 'Verify IDE sources, Javadocs and AndroidX samples across all classpaths.'
        notCompatibleWithConfigurationCache('Explicit maintenance task resolves detached configurations.')
        doLast {
            def distribution = root.configurations.detachedConfiguration(
                root.dependencies.create("gradle:gradle:${gradle.gradleVersion}:src@zip"))
            distribution.transitive = false
            distribution.resolve()
            logger.lifecycle("Verified Gradle ${gradle.gradleVersion} source ZIP.")
            def resolvedAttachments = new LinkedHashSet()
            def verifySources = { handler, componentIds, label ->
                def result = handler.createArtifactResolutionQuery().forComponents(componentIds)
                    .withArtifacts(org.gradle.jvm.JvmLibrary, org.gradle.language.base.artifact.SourcesArtifact, org.gradle.language.java.artifact.JavadocArtifact).execute()
                result.components.each { component ->
                    if (component instanceof org.gradle.api.artifacts.result.UnresolvedComponentResult) throw component.failure
                    [org.gradle.language.base.artifact.SourcesArtifact, org.gradle.language.java.artifact.JavadocArtifact].collectMany { component.getArtifacts(it) }.each { artifact ->
                        if (artifact instanceof org.gradle.api.artifacts.result.UnresolvedArtifactResult) {
                            throw artifact.failure
                        }
                        def id = component.id
                        resolvedAttachments.add("${id.group}:${id.module}:${id.version}:${artifact.file.name}".toString())
                    }
                }
                logger.lifecycle("Checked ${componentIds.size()} ${label} components.")
            }
            def componentIds = { configuration ->
                configuration.incoming.resolutionResult.allComponents.collect { it.id }
                    .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }.toSet()
            }
            // Settings plugins (for example Foojay) have a separate repository/classpath scope.
            def settingsIds = componentIds(settingsBuildscript.configurations.getByName('classpath'))
            verifySources(settingsBuildscript.dependencies, settingsIds, 'settings-plugin')
            def pluginScopes = [:]
            root.allprojects.each { project ->
                def pluginIds = componentIds(project.buildscript.configurations.getByName('classpath'))
                pluginIds.each { pluginScopes["${it.group}:${it.module}:${it.version}".toString()] = project.buildscript }
                verifySources(project.buildscript.dependencies, pluginIds, "${project.path} build-plugin")
            }
            settingsIds.each { pluginScopes["${it.group}:${it.module}:${it.version}".toString()] = settingsBuildscript }
            def ids = new LinkedHashSet()
            root.allprojects.each { project ->
                project.configurations.findAll { it.canBeResolved && it.name.toLowerCase().endsWith('classpath') && (it.name.toLowerCase().contains('compile') || it.name.toLowerCase().contains('runtime')) }.collect { it.name }.each { name ->
                    def configuration = project.configurations.findByName(name)
                    if (configuration != null && configuration.canBeResolved) {
                        // Variant-based sources include every declared file (such as AndroidX
                        // samples); ArtifactResolutionQuery only asks for the sources classifier.
                        def sourceView = configuration.incoming.artifactView {
                            withVariantReselection()
                            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.group.startsWith('androidx.') }
                            attributes {
                                attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE, root.objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.DOCUMENTATION))
                                attribute(org.gradle.api.attributes.DocsType.DOCS_TYPE_ATTRIBUTE, root.objects.named(org.gradle.api.attributes.DocsType, org.gradle.api.attributes.DocsType.SOURCES))
                            }
                        }
                        sourceView.artifacts.artifacts.each { artifact ->
                            def id = artifact.id.componentIdentifier
                            resolvedAttachments.add("${id.group}:${id.module}:${id.version}:${artifact.file.name}".toString())
                        }
                        configuration.incoming.resolutionResult.allComponents.each { component ->
                            if (component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) ids.add(component.id)
                        }
                    }
                }
            }
            verifySources(root.dependencies, ids, 'Android/JVM compile/runtime/test classpath')
            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
            def document = factory.newDocumentBuilder().parse(root.file('gradle/verification-metadata.xml'))
            def components = document.getElementsByTagName('component')
            int count = 0
            for (int i = 0; i < components.length; i++) {
                def component = components.item(i)
                def artifacts = component.getElementsByTagName('artifact')
                for (int j = 0; j < artifacts.length; j++) {
                    def artifact = artifacts.item(j)
                    if (!artifact.getAttribute('name').endsWith('-sources.jar') && !artifact.getAttribute('name').endsWith('-javadoc.jar')) continue
                    def name = component.getAttribute('name')
                    def version = component.getAttribute('version')
                    def fileName = artifact.getAttribute('name')
                    def module = "${component.getAttribute('group')}:${name}:${version}".toString()
                    // Variant files may have a different name from the module (AndroidX samples).
                    if (resolvedAttachments.contains("${module}:${fileName}".toString())) {
                        count++
                        continue
                    }
                    def prefix = "${name}-${version}-"
                    if (!fileName.startsWith(prefix)) throw new GradleException("Unexpected source artifact name: ${fileName}")
                    // Kotlin Gradle plugins publish variant classifiers such as gradle813-sources.
                    def classifier = fileName.substring(prefix.length(), fileName.length() - 4)
                    def coordinate = "${module}:${classifier}@jar"
                    // Keep settings-only artifacts in their original repository scope.
                    def scope = pluginScopes[module] ?: root
                    def configuration = scope.configurations.detachedConfiguration(scope.dependencies.create(coordinate))
                    configuration.transitive = false
                    // Guava publishes both Android and JRE variants; select JRE for its tools;
                    // the explicit classifier still selects the recorded source JAR.
                    if (component.getAttribute('group') == 'com.google.guava' && name == 'guava') configuration.attributes {
                        attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE, root.objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
                        attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, root.objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM))
                    }
                    configuration.resolve()
                    count++
                }
            }
            if (count == 0) throw new GradleException('No IDE attachments recorded.')
            logger.lifecycle("Verified ${count} IDE source/Javadoc artifacts.")
        }
    }
}
